root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/http_server"
  bin = "./tmp/api"
  delay = 500
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "vendor", "testdata", "migrations"]
  exclude_regex = ["_test\\.go"]
  stop_on_error = true
  log = "build-errors.log"

[log]
  time = false

[misc]
  clean_on_exit = false
