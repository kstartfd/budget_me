# budget_me — CI/CD
#
# Flow: git push main  ->  build:backend + build:frontend build Docker images on
# the runner (Docker-in-Docker) and push them to the GitLab Container Registry
# ->  deploy SSHes into the VPS, renders ~/budget_me/.env, docker login, then
# `docker compose pull && up -d && migrate`. The VPS never builds (1 GB RAM).
#
# Registry (auto): registry.gitlab.com/kstartfd/budget_me
#   $CI_REGISTRY_IMAGE/backend:<sha>   $CI_REGISTRY_IMAGE/frontend:<sha>
#
# Required CI/CD variables (Settings -> CI/CD -> Variables) — see infra/budget/CI_CD.md:
#   SSH_PRIVATE_KEY (File, protected)  SSH_HOST  SSH_KNOWN_HOSTS
#   DEPLOY_TOKEN_USER  DEPLOY_TOKEN_PASSWORD (masked)
#   DOMAIN  POSTGRES_PASSWORD (masked)  AUTH_SECRET (masked)  TELEGRAM_BOT_TOKEN (masked)

stages:
  - test
  - build
  - deploy

# ── test ─────────────────────────────────────────────────────────────────────
# Gate the pipeline on a clean backend (vet + tests) and frontend (lint + types).
# Runs on main, tags and merge requests.
.test-rules:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_IID'
      changes: &budget_paths
        - apps/budget/**/*
        - infra/budget/**/*
        - infra/edge/Caddyfile
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *budget_paths

test:backend:
  extends: .test-rules
  stage: test
  image: golang:1.25-alpine
  script:
    - cd apps/budget/backend
    - go vet ./...
    - go test ./...

test:frontend:
  extends: .test-rules
  stage: test
  image: node:22-alpine
  before_script:
    - corepack enable
  script:
    - cd apps/budget/frontend
    # --ignore-scripts: pnpm 10 fails install in CI on unapproved dependency
    # build scripts (sharp/@swc/core/…); lint+typecheck don't need them built.
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm lint
    - pnpm typecheck
  cache:
    key:
      files:
        - apps/budget/frontend/pnpm-lock.yaml
    paths:
      - apps/budget/frontend/node_modules

# ── build ────────────────────────────────────────────────────────────────────
# Shared Docker-in-Docker config. DOCKER_TLS_CERTDIR="/certs" turns on TLS; the
# remaining DOCKER_* vars point the docker client at the dind service over TLS
# (without them the build cannot reach the daemon).
.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *budget_paths

build:backend:
  extends: .build
  needs: [test:backend]
  script:
    # Context is apps/budget; the Dockerfile COPYs backend/… from there.
    - docker build
        -f infra/budget/docker/backend.Dockerfile
        -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
        -t "$CI_REGISTRY_IMAGE/backend:latest"
        apps/budget
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"

build:frontend:
  extends: .build
  needs: [test:frontend]
  script:
    # Context is apps/budget/frontend.
    - docker build
        -f infra/budget/docker/frontend.Dockerfile
        -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
        -t "$CI_REGISTRY_IMAGE/frontend:latest"
        apps/budget/frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"

# ── deploy ───────────────────────────────────────────────────────────────────
# SSH into the VPS, push the compose file + Caddyfile + a freshly rendered .env,
# then pull the images just built and (re)start the stack.
#
# Auto-deploys every green `main` pipeline (no manual gate). The rollout is
# fail-safe: the new env is staged as .env.new, migrations run BEFORE the app is
# switched, and the backend must pass /healthz. If ANY step fails the previous
# images are restored, so prod stays on the last good version and the pipeline
# goes red — a broken version is never shipped, and nothing new ships until the
# fix lands. `resource_group: production` serialises overlapping deploys.
deploy:
  stage: deploy
  image: alpine:3.20
  needs:
    - build:backend
    - build:frontend
  resource_group: production
  environment:
    name: production
    url: https://$DOMAIN
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # SSH_PRIVATE_KEY is a File-type variable -> $SSH_PRIVATE_KEY is a path.
    # (cat; echo) guarantees a trailing newline — a key pasted into the CI
    # variable without one makes ssh-add fail with "error in libcrypto".
    - (cat "$SSH_PRIVATE_KEY"; echo) > ~/.ssh/id_deploy && chmod 400 ~/.ssh/id_deploy
    - ssh-add ~/.ssh/id_deploy
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    # 1. Layout on the server: compose at ~/budget_me/prod.yml, Caddyfile at
    #    ~/budget_me/infra/edge/Caddyfile (matches the ./infra/edge mount).
    - ssh "deploy@$SSH_HOST" "mkdir -p ~/budget_me/infra/edge ~/budget_me/scripts"
    - scp infra/budget/compose/prod.yml "deploy@$SSH_HOST:~/budget_me/prod.yml"
    - scp infra/edge/Caddyfile "deploy@$SSH_HOST:~/budget_me/infra/edge/Caddyfile"
    - scp infra/budget/scripts/backup.sh infra/budget/scripts/healthcheck.sh infra/budget/scripts/merge-env.sh "deploy@$SSH_HOST:~/budget_me/scripts/"
    - ssh "deploy@$SSH_HOST" "chmod +x ~/budget_me/scripts/*.sh"
    # The crons are owned by the repo, not by whoever last SSHed in: the deploy
    # plants a missing line and leaves an existing one alone.
    - |
      ssh "deploy@$SSH_HOST" 'bash -s' < infra/budget/cron/install-crons.sh
    # Backups are only as real as their config: say so here rather than let the
    # cron fail into a log nobody reads.
    - |
      if [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$BACKUP_CHAT_ID" ]; then
        echo "NOTE: BACKUP_* not in CI — expecting them in ~/budget_me/.env.local"
        echo "NOTE: on the server (see infra/budget/DEPLOY.md). If they are in neither,"
        echo "NOTE: the nightly backup fails and prod keeps its only copy on one disk."
      fi
    # 2. Stage the NEW env as .env.new (NOT the live .env) so a failed rollout
    #    can fall back to the previous images. The heredoc expands on THIS runner.
    - |
      ssh "deploy@$SSH_HOST" "cat > ~/budget_me/.env.new && chmod 600 ~/budget_me/.env.new" <<EOF
      DOMAIN=$DOMAIN
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      AUTH_SECRET=$AUTH_SECRET
      TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
      ACCOUNT_DELETION_GRACE=${ACCOUNT_DELETION_GRACE:-720h}
      AI_API_KEY=$AI_API_KEY
      AI_MODEL=${AI_MODEL:-glm-4.5-flash}
      AI_BASE_URL=${AI_BASE_URL:-https://api.z.ai/api/paas/v4}
      BACKUP_CHAT_ID=$BACKUP_CHAT_ID
      BACKUP_PASSPHRASE=$BACKUP_PASSPHRASE
      ALERT_CHAT_ID=$ALERT_CHAT_ID
      BACKEND_IMAGE=$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
      FRONTEND_IMAGE=$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
      EOF
    # Secrets the operator chose to keep on the server (~/budget_me/.env.local)
    # fill in whatever CI left empty. Without this the render above would blank
    # them on every deploy, and the CI variables would be the only place a value
    # could live.
    - ssh "deploy@$SSH_HOST" "cd ~/budget_me && ./scripts/merge-env.sh .env.new .env.local"
    # 3. Deploy with automatic rollback. Runner-side $vars expand in this
    #    unquoted heredoc; remote-only vars are escaped as \$var. On any error
    #    the ERR trap restores .env.prev and brings the old images back up.
    - |
      ssh "deploy@$SSH_HOST" 'bash -s' <<EOF
      set -e
      cd ~/budget_me
      docker login registry.gitlab.com -u '$DEPLOY_TOKEN_USER' -p '$DEPLOY_TOKEN_PASSWORD'

      rollback() {
        echo "deploy failed — rolling back to previous version"
        if [ -f .env.prev ]; then
          mv -f .env.prev .env
          docker compose --env-file .env -f prod.yml up -d || true
        fi
        exit 1
      }
      trap rollback ERR

      cp -f .env .env.prev 2>/dev/null || true
      mv -f .env.new .env

      docker compose --env-file .env -f prod.yml pull
      # Migrate before switching the app so a bad migration never leaves new
      # code running against an unmigrated DB (postgres image is pinned, so
      # "up -d postgres" only ensures the DB is up — it never swaps versions).
      docker compose --env-file .env -f prod.yml up -d postgres

      # A dump taken seconds before the migration — the rollback above restores
      # the previous IMAGES, but nothing restores a table a migration dropped.
      # Local copy only (Telegram is the nightly job's business), and never fatal:
      # a deploy that is fine must not be blocked by a backup that is not.
      # </dev/null here too: this heredoc IS the remote shell's stdin, and anything
      # inside the script that reads stdin devours the rest of the deploy.
      ./scripts/backup.sh --local </dev/null || echo "pre-migrate backup failed — continuing"
      # -T + </dev/null: this whole script is piped to the remote 'bash -s' over
      # ssh stdin, and 'compose run' attaches stdin by default — without the
      # redirect it swallows the rest of the script and the deploy stops here.
      docker compose --env-file .env -f prod.yml --profile tools run --rm -T migrate </dev/null
      docker compose --env-file .env -f prod.yml up -d

      # The Caddyfile is bind-mounted, so a changed FILE does not change the
      # container spec and "up -d" leaves the old config running in memory. Ask
      # Caddy to re-read it (zero downtime); force a recreate if that fails.
      docker compose --env-file .env -f prod.yml exec -T caddy \
        caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile </dev/null \
        || docker compose --env-file .env -f prod.yml up -d --force-recreate caddy

      # The containers must actually BE the version we just shipped. A deploy that
      # silently changes nothing and reports success is worse than a failed one:
      # a `compose exec` inside a called script ate the rest of this heredoc from
      # ssh stdin, and two green pipelines in a row left prod on the old image.
      want_backend="\$(grep '^BACKEND_IMAGE=' .env | cut -d= -f2-)"
      got_backend="\$(docker inspect budget_me-backend-1 --format '{{.Config.Image}}')"
      if [ "\$want_backend" != "\$got_backend" ]; then
        echo "backend runs \$got_backend, expected \$want_backend — deploy did not take"
        false
      fi

      # Health gate: backend must report healthy within ~30s or we roll back.
      ok=""
      for i in \$(seq 1 10); do
        if docker run --rm --network budget_me_default curlimages/curl:latest \
             -fsS http://backend:8080/healthz </dev/null >/dev/null 2>&1; then
          ok=1; break
        fi
        sleep 3
      done
      [ -n "\$ok" ] || false

      trap - ERR
      rm -f .env.prev
      # Reclaim disk: past deploys leave old per-SHA backend/frontend images.
      # Runs only here (health passed, no rollback), so nothing in use is hit —
      # the 4 running services keep their images; the registry stays the source
      # of truth for any future rollback. Never fail the deploy on cleanup.
      docker image prune -f >/dev/null 2>&1 || true
      echo "deploy healthy on $CI_COMMIT_SHORT_SHA"
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *budget_paths

# Learning: its own test/build jobs below (independent of budget), deployed to the
# same box by `deploy:learning` at the end of this file.
.learning-test-rules:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_IID'
      changes: &learning_paths
        - apps/learning/**/*
        - infra/learning/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *learning_paths

.learning-build-rules:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *learning_paths

test:learning-backend:
  extends: .learning-test-rules
  stage: test
  image: golang:1.25-alpine
  script:
    - cd apps/learning/backend
    - go vet ./...
    - go test ./...

test:learning-frontend:
  extends: .learning-test-rules
  stage: test
  image: node:22-alpine
  before_script:
    - corepack enable
  script:
    - cd apps/learning/frontend
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm lint
    - pnpm typecheck
  cache:
    key:
      files:
        - apps/learning/frontend/pnpm-lock.yaml
    paths:
      - apps/learning/frontend/node_modules

build:learning-backend:
  extends:
    - .build
    - .learning-build-rules
  needs: [test:learning-backend]
  script:
    - docker build
        -f infra/learning/docker/backend.Dockerfile
        -t "$CI_REGISTRY_IMAGE/learning-backend:$CI_COMMIT_SHORT_SHA"
        apps/learning
    - docker push "$CI_REGISTRY_IMAGE/learning-backend:$CI_COMMIT_SHORT_SHA"

build:learning-frontend:
  extends:
    - .build
    - .learning-build-rules
  needs: [test:learning-frontend]
  script:
    - docker build
        -f infra/learning/docker/frontend.Dockerfile
        --build-arg "NEXT_PUBLIC_LEARNING_BOT_URL=${LEARNING_BOT_URL:-https://t.me/nexyrium_bot}"
        -t "$CI_REGISTRY_IMAGE/learning-frontend:$CI_COMMIT_SHORT_SHA"
        apps/learning/frontend
    - docker push "$CI_REGISTRY_IMAGE/learning-frontend:$CI_COMMIT_SHORT_SHA"

# ── deploy:learning ──────────────────────────────────────────────────────────
# Same box, own Compose project in ~/learning (own postgres, own bot, own secrets).
# Same fail-safe shape as `deploy`: the env is staged as .env.new, a backup and the
# migrations run BEFORE the switch, the running containers must be the images just
# shipped, /healthz gates, and an ERR trap restores the previous images.
#
# Secrets (POSTGRES_PASSWORD, AUTH_SECRET, DOMAIN, TELEGRAM_BOT_TOKEN, BACKUP_*)
# live in ~/learning/.env.local on the box and are merged in by merge-env.sh. They
# are deliberately NOT read from CI here: the CI variables of those names belong
# to budget_me and would silently point learning at budget's database and bot.
#
# resource_group: production is shared with `deploy` on purpose — the crontab and
# the Caddy fronting both apps are shared state. `needs: deploy (optional)` makes a
# pipeline that changes both ship budget first (Caddy + the apps_edge network).
deploy:learning:
  stage: deploy
  image: alpine:3.20
  needs:
    - build:learning-backend
    - build:learning-frontend
    - job: deploy
      optional: true
  resource_group: production
  environment:
    name: learning
    url: https://learning.budgetme.xyz
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - (cat "$SSH_PRIVATE_KEY"; echo) > ~/.ssh/id_deploy && chmod 400 ~/.ssh/id_deploy
    - ssh-add ~/.ssh/id_deploy
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
  script:
    - ssh "deploy@$SSH_HOST" "mkdir -p ~/learning/scripts"
    - scp infra/learning/compose/prod.yml "deploy@$SSH_HOST:~/learning/prod.yml"
    # backup.sh and merge-env.sh are budget's scripts, shared: backup.sh takes the
    # app and database names from the environment (see the crontab line).
    - scp infra/budget/scripts/backup.sh infra/budget/scripts/merge-env.sh "deploy@$SSH_HOST:~/learning/scripts/"
    - ssh "deploy@$SSH_HOST" "chmod +x ~/learning/scripts/*.sh"
    - |
      ssh "deploy@$SSH_HOST" 'bash -s' < infra/learning/cron/install-crons.sh
    - |
      ssh "deploy@$SSH_HOST" "cat > ~/learning/.env.new && chmod 600 ~/learning/.env.new" <<EOF
      BACKEND_IMAGE=$CI_REGISTRY_IMAGE/learning-backend:$CI_COMMIT_SHORT_SHA
      FRONTEND_IMAGE=$CI_REGISTRY_IMAGE/learning-frontend:$CI_COMMIT_SHORT_SHA
      EOF
    - ssh "deploy@$SSH_HOST" "cd ~/learning && ./scripts/merge-env.sh .env.new .env.local"
    - |
      ssh "deploy@$SSH_HOST" 'bash -s' <<EOF
      set -e
      cd ~/learning
      docker login registry.gitlab.com -u '$DEPLOY_TOKEN_USER' -p '$DEPLOY_TOKEN_PASSWORD'

      rollback() {
        echo "learning deploy failed — rolling back to previous version"
        if [ -f .env.prev ]; then
          mv -f .env.prev .env
          docker compose --env-file .env -f prod.yml up -d || true
        fi
        exit 1
      }
      trap rollback ERR

      cp -f .env .env.prev 2>/dev/null || true
      mv -f .env.new .env

      docker compose --env-file .env -f prod.yml pull
      docker compose --env-file .env -f prod.yml up -d postgres

      # Local dump right before the migration; never fatal. </dev/null on every
      # step that could read stdin: this heredoc IS the remote shell's stdin.
      APP_NAME=learning DB_USER=learning_app DB_NAME=learning_app ./scripts/backup.sh --local </dev/null || echo "pre-migrate backup failed — continuing"
      docker compose --env-file .env -f prod.yml --profile tools run --rm -T migrate </dev/null
      docker compose --env-file .env -f prod.yml up -d

      # The containers must actually BE the images we just shipped (a deploy that
      # silently changes nothing and reports success is worse than a failed one).
      want_backend="\$(grep '^BACKEND_IMAGE=' .env | cut -d= -f2-)"
      got_backend="\$(docker inspect learning_app-backend-1 --format '{{.Config.Image}}')"
      if [ "\$want_backend" != "\$got_backend" ]; then
        echo "backend runs \$got_backend, expected \$want_backend — deploy did not take"
        false
      fi
      want_frontend="\$(grep '^FRONTEND_IMAGE=' .env | cut -d= -f2-)"
      got_frontend="\$(docker inspect learning_app-frontend-1 --format '{{.Config.Image}}')"
      if [ "\$want_frontend" != "\$got_frontend" ]; then
        echo "frontend runs \$got_frontend, expected \$want_frontend — deploy did not take"
        false
      fi

      # Health gate: backend must report healthy within ~30s or we roll back.
      ok=""
      for i in \$(seq 1 10); do
        if docker run --rm --network learning_app_default alpine:3.20 \
             wget -qO- -T 3 http://backend:8080/healthz </dev/null >/dev/null 2>&1; then
          ok=1; break
        fi
        sleep 3
      done
      [ -n "\$ok" ] || false

      trap - ERR
      rm -f .env.prev
      docker image prune -f >/dev/null 2>&1 || true
      echo "learning deploy healthy on $CI_COMMIT_SHORT_SHA"
      EOF
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes: *learning_paths
