# budget_me — CI/CD
#
# Flow: git push main  ->  test + build of BOTH apps (Docker images are built on
# the runner with Docker-in-Docker and pushed to the GitLab Container Registry)
# ->  deploy:learning goes out by itself when learning changed (its tests and
#     builds green); deploy:budget and both rollbacks are manual buttons:
#   deploy:budget   deploy:learning      SSH into the VPS, render the app's env and
#                                        run scripts/bluegreen.sh: migrate, start
#                                        the idle colour, health, switch Caddy
#   rollback:budget rollback:learning    switch the app back to a previous release
# The VPS never builds (1 GB RAM).
#
# Registry (auto): registry.gitlab.com/kstartfd/budget_me
#   $CI_REGISTRY_IMAGE/{backend,frontend}:<sha>
#   $CI_REGISTRY_IMAGE/learning-{backend,frontend}:<sha>
#
# Required CI/CD variables (Settings -> CI/CD -> Variables) — see infra/budget/CI_CD.md:
#   SSH_PRIVATE_KEY (File, protected)  SSH_HOST  SSH_KNOWN_HOSTS
#   DEPLOY_TOKEN_USER  DEPLOY_TOKEN_PASSWORD (masked)
# budget:
#   DOMAIN  POSTGRES_PASSWORD (masked)  AUTH_SECRET (masked)  TELEGRAM_BOT_TOKEN (masked)
# learning:
#   LEARNING_POSTGRES_PASSWORD (masked)  LEARNING_AUTH_SECRET (masked)
#   LEARNING_TELEGRAM_BOT_TOKEN (masked)   [LEARNING_DOMAIN: default below]
# both (the shared account database, libs/account):
#   ACCOUNT_POSTGRES_PASSWORD (masked) — ONE value, rendered into both apps' env
# An app's secrets may live on the server instead — ~/budget_me/.env.local (budget),
# ~/budget_me/.env.learning.local (learning): CI wins when it has a value, the file
# fills what CI left empty. A deploy with a required value in neither stops early.

variables:
  # A project variable of the same name overrides this default.
  LEARNING_DOMAIN: learning.budgetme.xyz

stages:
  - test
  - build
  - deploy
  - rollback

# ── test ─────────────────────────────────────────────────────────────────────
# Gate the pipeline on a clean backend (vet + tests) and frontend (lint + types).
# Runs on tags, merge requests (only when the app's files changed) and on every
# main pipeline — both apps are always built on main, so both deploy buttons
# always exist and ship exactly the commit the pipeline is for.
.test-rules:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - apps/budget/**/*
        - libs/account/**/*
        - infra/budget/**/*
        - infra/edge/Caddyfile
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'

# Two throwaway Postgres instances so the DB-backed tests run for real instead of
# skipping: one for the app's own database, one for the shared account database
# (libs/account). Service variables stay with their own container.
.db-services:
  services:
    - name: postgres:16-alpine
      alias: pg
      variables:
        POSTGRES_USER: ci
        POSTGRES_PASSWORD: ci
        POSTGRES_DB: app
    - name: postgres:16-alpine
      alias: pgaccount
      variables:
        POSTGRES_USER: ci
        POSTGRES_PASSWORD: ci
        POSTGRES_DB: account
  variables:
    DATABASE_URL: postgres://ci:ci@pg:5432/app?sslmode=disable
    ACCOUNT_DATABASE_URL: postgres://ci:ci@pgaccount:5432/account?sslmode=disable

# The shared account module both backends sit on.
test:account:
  extends: .db-services
  stage: test
  image: golang:1.25-alpine
  script:
    - cd libs/account
    - go vet ./...
    - go test ./...
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - libs/account/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'

test:backend:
  extends:
    - .test-rules
    - .db-services
  stage: test
  image: golang:1.25-alpine
  script:
    - cd apps/budget/backend
    - go run ./cmd/migrate up
    - go vet ./...
    - go test ./...

test:frontend:
  extends: .test-rules
  stage: test
  image: node:22-alpine
  before_script:
    - corepack enable
  script:
    - cd apps/budget/frontend
    # --ignore-scripts: pnpm 10 fails install in CI on unapproved dependency
    # build scripts (sharp/@swc/core/…); lint+typecheck don't need them built.
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm lint
    - pnpm typecheck
  cache:
    key:
      files:
        - apps/budget/frontend/pnpm-lock.yaml
    paths:
      - apps/budget/frontend/node_modules

# ── build ────────────────────────────────────────────────────────────────────
# Shared Docker-in-Docker config. DOCKER_TLS_CERTDIR="/certs" turns on TLS; the
# remaining DOCKER_* vars point the docker client at the dind service over TLS
# (without them the build cannot reach the daemon).
.build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'

build:backend:
  extends: .build
  needs: [test:backend, test:account]
  script:
    # Context is the repo root: the Dockerfile COPYs apps/budget/backend and the
    # shared libs/account (infra/budget/docker/backend.Dockerfile.dockerignore
    # keeps everything else out).
    - docker build
        -f infra/budget/docker/backend.Dockerfile
        -t "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
        -t "$CI_REGISTRY_IMAGE/backend:latest"
        .
    - docker push "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"

build:frontend:
  extends: .build
  needs: [test:frontend]
  script:
    # Context is apps/budget/frontend.
    - docker build
        -f infra/budget/docker/frontend.Dockerfile
        -t "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
        -t "$CI_REGISTRY_IMAGE/frontend:latest"
        apps/budget/frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"

# ── deploy (blue-green) ──────────────────────────────────────────────────────
# Both apps run on one VPS behind one Caddy, each in two colours (blue/green)
# with its own database in the shared Postgres. A deploy ships the compose
# files, Caddyfile and scripts, renders the app's env, and hands over to
# scripts/bluegreen.sh on the server:
#
#   backup → migrate up (new image) → start the IDLE colour → health →
#   switch Caddy (reload, zero downtime) → watch the public URL → record the
#   release in releases-<app>.log
#
# Any failure before the release is recorded puts traffic back on the colour
# that was live and the schema back where it was, and reds the pipeline. The
# previous colour keeps running: rollback:<app> is a switch, not a redeploy.
#
# deploy:budget is a MANUAL button on every main pipeline; deploy:learning is
# automatic when learning changed (see its rules) and a button otherwise.
# allow_failure keeps an unpressed button from blocking the pipeline. One resource_group per
# app: two deploys of the same app never interleave, budget and learning never
# wait for each other.

.ssh:
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    # SSH_PRIVATE_KEY is a File-type variable -> $SSH_PRIVATE_KEY is a path.
    # (cat; echo) guarantees a trailing newline — a key pasted into the CI
    # variable without one makes ssh-add fail with "error in libcrypto".
    - (cat "$SSH_PRIVATE_KEY"; echo) > ~/.ssh/id_deploy && chmod 400 ~/.ssh/id_deploy
    - ssh-add ~/.ssh/id_deploy
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

# Shared by both deploys: everything the server needs besides the env files.
# The *.active.caddy files are NOT shipped — on the server bluegreen.sh owns
# them, and copying the repo defaults over would silently switch colours.
.ship:
  script:
    - ssh "deploy@$SSH_HOST" "mkdir -p ~/budget_me/infra/edge ~/budget_me/scripts"
    - scp infra/budget/compose/prod.yml "deploy@$SSH_HOST:~/budget_me/prod.yml"
    - scp infra/learning/compose/prod.yml "deploy@$SSH_HOST:~/budget_me/learning.yml"
    - scp infra/edge/Caddyfile "deploy@$SSH_HOST:~/budget_me/infra/edge/Caddyfile"
    - scp infra/budget/scripts/backup.sh infra/budget/scripts/healthcheck.sh infra/budget/scripts/merge-env.sh infra/budget/scripts/bluegreen.sh "deploy@$SSH_HOST:~/budget_me/scripts/"
    - ssh "deploy@$SSH_HOST" "chmod +x ~/budget_me/scripts/*.sh"
    # The crons are owned by the repo, not by whoever last SSHed in: the deploy
    # plants a missing line and leaves an existing one alone.
    - |
      ssh "deploy@$SSH_HOST" 'bash -s' < infra/budget/cron/install-crons.sh
    # Backups are only as real as their config: say so here rather than let the
    # cron fail into a log nobody reads.
    - |
      if [ -z "$BACKUP_PASSPHRASE" ] || [ -z "$BACKUP_CHAT_ID" ]; then
        echo "NOTE: BACKUP_* not in CI — expecting them in ~/budget_me/.env.local"
        echo "NOTE: on the server (see infra/budget/DEPLOY.md). If they are in neither,"
        echo "NOTE: the nightly backup fails and prod keeps its only copy on one disk."
      fi

# The server half of every deploy. Expects $APP, $APP_ENV (the env file name on
# the server, freshly rendered as $APP_ENV.new), $REQUIRED_KEYS (names that must
# have a value there), $NEW_BACKEND, $NEW_FRONTEND.
# Runner-side $vars expand in this unquoted heredoc; remote-only ones are \$.
.bluegreen-deploy:
  script:
    - |
      ssh "deploy@$SSH_HOST" 'bash -s' <<EOF
      set -e
      cd ~/budget_me
      docker login registry.gitlab.com -u '$DEPLOY_TOKEN_USER' -p '$DEPLOY_TOKEN_PASSWORD'

      # An empty secret renders fine and only fails later (a backend that will not
      # start, a database role with no password). Say which one, before anything
      # live is touched.
      missing=""
      for k in $REQUIRED_KEYS; do
        grep -qE "^\$k=." $APP_ENV.new || missing="\$missing \$k"
      done
      if [ -n "\$missing" ]; then
        echo "deploy $APP: нет значений в $APP_ENV.new:\$missing"
        echo "задайте их в CI/CD Variables или в ~/budget_me/$APP_ENV.local на сервере"
        exit 1
      fi

      # The render above only knows CI variables. The blue-green state and the
      # LIVE release (what cron/admin run until the switch) come from the
      # current env; the new images go to bluegreen.sh as arguments.
      cp -f $APP_ENV $APP_ENV.prev 2>/dev/null || touch $APP_ENV.prev
      grep -E '^(ACTIVE_COLOR|BACKEND_IMAGE|FRONTEND_IMAGE|(BLUE|GREEN)_(BACKEND|FRONTEND)_IMAGE)=' $APP_ENV.prev >> $APP_ENV.new || true
      # First deploy of an app: nothing live yet — the new release is the fallback.
      grep -q '^BACKEND_IMAGE=.' $APP_ENV.new || echo 'BACKEND_IMAGE=$NEW_BACKEND' >> $APP_ENV.new
      grep -q '^FRONTEND_IMAGE=.' $APP_ENV.new || echo 'FRONTEND_IMAGE=$NEW_FRONTEND' >> $APP_ENV.new
      mv -f $APP_ENV.new $APP_ENV
      chmod 600 $APP_ENV

      if ! ./scripts/bluegreen.sh $APP deploy '$NEW_BACKEND' '$NEW_FRONTEND'; then
        # bluegreen.sh already put traffic and schema back; restore the env too.
        mv -f $APP_ENV.prev $APP_ENV
        exit 1
      fi
      rm -f $APP_ENV.prev

      # Reclaim disk: dangling layers only. Tagged per-SHA images stay — the
      # idle colour and a rollback:2 may still need them (and the registry
      # keeps every one of them anyway).
      docker image prune -f >/dev/null 2>&1 || true
      ./scripts/bluegreen.sh $APP status
      EOF

deploy:budget:
  extends: .ssh
  stage: deploy
  needs:
    - build:backend
    - build:frontend
  resource_group: production-budget
  environment:
    name: production
    url: https://$DOMAIN
  variables:
    APP: budget
    APP_ENV: .env
    REQUIRED_KEYS: "DOMAIN POSTGRES_PASSWORD ACCOUNT_POSTGRES_PASSWORD AUTH_SECRET"
    NEW_BACKEND: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
    NEW_FRONTEND: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  script:
    - !reference [.ship, script]
    # Stage the NEW env as .env.new (NOT the live .env). The heredoc expands on
    # THIS runner. Image lines are added on the server (.bluegreen-deploy).
    - |
      ssh "deploy@$SSH_HOST" "cat > ~/budget_me/.env.new && chmod 600 ~/budget_me/.env.new" <<EOF
      DOMAIN=$DOMAIN
      LEARNING_DOMAIN=$LEARNING_DOMAIN
      POSTGRES_PASSWORD=$POSTGRES_PASSWORD
      AUTH_SECRET=$AUTH_SECRET
      TELEGRAM_BOT_TOKEN=$TELEGRAM_BOT_TOKEN
      ACCOUNT_POSTGRES_PASSWORD=$ACCOUNT_POSTGRES_PASSWORD
      ACCOUNT_DELETION_GRACE=${ACCOUNT_DELETION_GRACE:-720h}
      AI_API_KEY=$AI_API_KEY
      AI_MODEL=${AI_MODEL:-glm-4.5-flash}
      AI_BASE_URL=${AI_BASE_URL:-https://api.z.ai/api/paas/v4}
      BACKUP_CHAT_ID=$BACKUP_CHAT_ID
      BACKUP_PASSPHRASE=$BACKUP_PASSPHRASE
      ALERT_CHAT_ID=$ALERT_CHAT_ID
      EOF
    # Secrets the operator chose to keep on the server (~/budget_me/.env.local)
    # fill in whatever CI left empty. Without this the render above would blank
    # them on every deploy, and the CI variables would be the only place a value
    # could live.
    - ssh "deploy@$SSH_HOST" "cd ~/budget_me && ./scripts/merge-env.sh .env.new .env.local"
    - !reference [.bluegreen-deploy, script]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# ── learning ─────────────────────────────────────────────────────────────────
# Learning runs on the same VPS as budget (learning.<domain>), with its own
# colours, database and releases log. Same rules as budget: tests and images on
# every main pipeline, deploy and rollback as manual buttons.
.learning-test-rules:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_MERGE_REQUEST_IID'
      changes:
        - apps/learning/**/*
        - libs/account/**/*
        - infra/learning/**/*
        - .gitlab-ci.yml
    - if: '$CI_COMMIT_BRANCH == "main"'

test:learning-backend:
  extends:
    - .learning-test-rules
    - .db-services
  stage: test
  image: golang:1.25-alpine
  script:
    # The picture reader is the real tesseract in a couple of tests (they skip without it).
    - apk add --no-cache tesseract-ocr tesseract-ocr-data-eng
    - cd apps/learning/backend
    - go run ./cmd/migrate up
    - go vet ./...
    - go test ./...

test:learning-frontend:
  extends: .learning-test-rules
  stage: test
  image: node:22-alpine
  before_script:
    - corepack enable
  script:
    - cd apps/learning/frontend
    - pnpm install --frozen-lockfile --ignore-scripts
    - pnpm lint
    - pnpm typecheck
  cache:
    key:
      files:
        - apps/learning/frontend/pnpm-lock.yaml
    paths:
      - apps/learning/frontend/node_modules

build:learning-backend:
  extends: .build
  needs: [test:learning-backend, test:account]
  script:
    - docker build
        -f infra/learning/docker/backend.Dockerfile
        -t "$CI_REGISTRY_IMAGE/learning-backend:$CI_COMMIT_SHORT_SHA"
        .
    - docker push "$CI_REGISTRY_IMAGE/learning-backend:$CI_COMMIT_SHORT_SHA"

build:learning-frontend:
  extends: .build
  needs: [test:learning-frontend]
  script:
    - docker build
        -f infra/learning/docker/frontend.Dockerfile
        --build-arg "NEXT_PUBLIC_LEARNING_BOT_URL=${LEARNING_BOT_URL:-https://t.me/nexyrium_bot}"
        -t "$CI_REGISTRY_IMAGE/learning-frontend:$CI_COMMIT_SHORT_SHA"
        apps/learning/frontend
    - docker push "$CI_REGISTRY_IMAGE/learning-frontend:$CI_COMMIT_SHORT_SHA"

deploy:learning:
  extends: .ssh
  stage: deploy
  needs:
    - build:learning-backend
    - build:learning-frontend
  resource_group: production-learning
  environment:
    name: learning
    url: https://$LEARNING_DOMAIN
  variables:
    APP: learning
    APP_ENV: .env.learning
    REQUIRED_KEYS: "DOMAIN POSTGRES_PASSWORD ACCOUNT_POSTGRES_PASSWORD AUTH_SECRET TELEGRAM_BOT_TOKEN"
    NEW_BACKEND: $CI_REGISTRY_IMAGE/learning-backend:$CI_COMMIT_SHORT_SHA
    NEW_FRONTEND: $CI_REGISTRY_IMAGE/learning-frontend:$CI_COMMIT_SHORT_SHA
  script:
    - !reference [.ship, script]
    # The learning env: its own domain, its own DB role password, session
    # secret and bot. Same staging pattern as budget (.env.learning.new).
    - |
      ssh "deploy@$SSH_HOST" "cat > ~/budget_me/.env.learning.new && chmod 600 ~/budget_me/.env.learning.new" <<EOF
      DOMAIN=$LEARNING_DOMAIN
      POSTGRES_PASSWORD=$LEARNING_POSTGRES_PASSWORD
      AUTH_SECRET=$LEARNING_AUTH_SECRET
      TELEGRAM_BOT_TOKEN=$LEARNING_TELEGRAM_BOT_TOKEN
      ACCOUNT_POSTGRES_PASSWORD=$ACCOUNT_POSTGRES_PASSWORD
      ACCOUNT_DELETION_GRACE=${ACCOUNT_DELETION_GRACE:-720h}
      EOF
    - ssh "deploy@$SSH_HOST" "cd ~/budget_me && ./scripts/merge-env.sh .env.learning.new .env.learning.local"
    - !reference [.bluegreen-deploy, script]
  # Learning rolls out by itself: once its tests and image builds are green (they
  # are in `needs`), a main pipeline deploys it whenever something that is part
  # of it changed. Any other main pipeline (a budget-only change) keeps the
  # button, so a deploy can still be forced by hand. A failed automatic deploy
  # puts traffic and schema back (bluegreen.sh) and reds the pipeline, so it
  # must not be allow_failure; rollback:learning stays manual.
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - apps/learning/**/*
        - libs/account/**/*
        - infra/learning/**/*
        - infra/edge/**/*
        - .gitlab-ci.yml
      when: on_success
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true

# ── rollback (blue-green) ────────────────────────────────────────────────────
# One manual button per app on every main pipeline. ROLLBACK_STEPS counts
# successful deploys back from the last one (releases-<app>.log); the button goes
# one step back. To go further, open the job and run it with the variable
# ROLLBACK_STEPS=2 (Run job → Variables):
#   1 — the previous release. Usually still running in the idle colour, so it is
#       a health check and a Caddy switch: seconds, no pull.
#   2 — the release before that. The idle colour is redeployed with it from the
#       registry (pull → start → health), then Caddy switches.
# After the switch the schema is migrated DOWN to the version that release was
# deployed with (backup first). Run the job with ROLLBACK_KEEP_SCHEMA=1 to keep
# the schema and the data written into it since (additive migrations only).
.rollback:
  extends: .ssh
  stage: rollback
  needs: []
  variables:
    ROLLBACK_STEPS: "1"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true
  script:
    - |
      ssh "deploy@$SSH_HOST" 'bash -s' <<EOF
      set -e
      cd ~/budget_me
      docker login registry.gitlab.com -u '$DEPLOY_TOKEN_USER' -p '$DEPLOY_TOKEN_PASSWORD'
      ROLLBACK_KEEP_SCHEMA='${ROLLBACK_KEEP_SCHEMA:-}' ./scripts/bluegreen.sh $APP rollback $ROLLBACK_STEPS
      ./scripts/bluegreen.sh $APP status
      EOF

rollback:budget:
  extends: .rollback
  resource_group: production-budget
  variables:
    APP: budget

rollback:learning:
  extends: .rollback
  resource_group: production-learning
  variables:
    APP: learning
